Define APP_ROOT /var/www/scar_jabbit

<VirtualHost *:80>
    ServerName scar-jabbit.local
    DocumentRoot ${APP_ROOT}/public
    DirectoryIndex index.php

    <Directory ${APP_ROOT}/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/scar_jabbit_error.log
    CustomLog ${APACHE_LOG_DIR}/scar_jabbit_access.log combined
</VirtualHost>
